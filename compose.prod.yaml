# Staging/production stack for one server (see docs/deployment.md).
#
# Runs prebuilt images from GHCR, pinned by IMAGE_TAG. Only Caddy publishes
# ports; postgres, api and web are reachable on the internal network only.
# Secrets come from .env next to this file (from .env.production.example), and
# each service gets only the variables it needs.
#
# Run it through deploy/compose.sh, which adds the deployed IMAGE_TAG.

name: montelingo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-image: &api-image ${IMAGE_REPOSITORY:-ghcr.io/montelingo/montelingo}-api:${IMAGE_TAG:?IMAGE_TAG is not set; run deploy/compose.sh}

x-api-environment: &api-environment
  MONTELINGO_ENV: production
  # Hex passwords only (openssl rand -hex 32): the password is part of a URL.
  MONTELINGO_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Applies migrations once per deploy, before the API starts.
  migrate:
    image: *api-image
    command: sh -c 'alembic -c apps/api/alembic.ini upgrade head && python apps/api/scripts/seed_content.py'
    logging: *logging
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    image: *api-image
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *api-environment
      MONTELINGO_ALLOWED_ORIGINS: https://${STAGING_DOMAIN:?}
      MONTELINGO_WEB_BASE_URL: https://${STAGING_DOMAIN:?}
      # The web container is the only proxy in front of the API.
      MONTELINGO_TRUSTED_PROXIES: 172.30.0.0/24
      MONTELINGO_SMTP_HOST: ${MONTELINGO_SMTP_HOST:?}
      MONTELINGO_SMTP_PORT: ${MONTELINGO_SMTP_PORT:-587}
      MONTELINGO_SMTP_SECURITY: ${MONTELINGO_SMTP_SECURITY:-starttls}
      MONTELINGO_SMTP_USERNAME: ${MONTELINGO_SMTP_USERNAME:-}
      MONTELINGO_SMTP_PASSWORD: ${MONTELINGO_SMTP_PASSWORD:-}
      MONTELINGO_SMTP_FROM: ${MONTELINGO_SMTP_FROM:?}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/api/v1/health/ready'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    image: ${IMAGE_REPOSITORY:-ghcr.io/montelingo/montelingo}-web:${IMAGE_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
      # Caddy is the one proxy in front of the web.
      TRUSTED_PROXY_HOPS: 1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:?}
      STAGING_BASIC_AUTH_HASH: ${STAGING_BASIC_AUTH_HASH:?}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
