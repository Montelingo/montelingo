name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ./apps/api

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated OpenAPI contract
        run: pnpm contract:check

      - name: Type-check API client
        run: pnpm --filter @app/api-client typecheck
