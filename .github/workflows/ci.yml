name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: '9.12.0'
  NODE_VERSION: '24'

jobs:
  frontend:
    name: Frontend (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check:web

      - name: Lint
        run: pnpm run lint:web

      - name: Type-check
        run: pnpm run typecheck:web

      - name: Unit tests
        run: pnpm run test:web

      - name: Production build
        run: pnpm run build:web

  backend:
    name: Backend (apps/api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: montelingo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d montelingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONTELINGO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/montelingo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install API dependencies
        run: uv sync --project apps/api --all-groups --locked

      - name: Check formatting
        run: uv run --project apps/api ruff format --check apps/api

      - name: Lint
        run: uv run --project apps/api ruff check apps/api

      - name: Type-check
        run: uv run --project apps/api mypy apps/api/app apps/api/scripts

      - name: Apply database migrations
        run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head

      - name: Unit and integration tests
        run: >-
          uv run --project apps/api pytest apps/api/tests -q
          --junitxml=apps/api/test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/api/test-results/junit.xml
          retention-days: 14

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: montelingo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d montelingo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONTELINGO_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/montelingo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install API dependencies
        run: uv sync --project apps/api --all-groups --locked

      - name: Apply migrations to a clean database
        run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head

      - name: Verify no model/migration drift
        run: uv run --project apps/api alembic -c apps/api/alembic.ini check

  contract:
    name: API contract (OpenAPI + generated client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install API dependencies
        run: uv sync --project apps/api --all-groups --locked

      - name: Expose uv-managed Python on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate and diff OpenAPI schema + generated client
        run: pnpm run contract:check

      - name: Type-check generated API client
        run: pnpm run typecheck:api-client
