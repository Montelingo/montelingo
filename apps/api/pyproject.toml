[project]
name = "montelingo-api"
version = "0.1.0"
description = "Montelingo FastAPI skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.2,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "pydantic-settings>=2.6.1,<3.0.0",
  "alembic>=1.13.3,<2.0.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "httpx>=0.27.2,<1.0.0",
  "mypy>=1.13.0,<2.0.0",
  "ruff>=0.7.2,<1.0.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api"
plugins = []
